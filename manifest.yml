modules:
  confluence:spacePage:
    - key: notice-window-space
      resource: space
      resolver:
        function: resolver
      render: native
      title: Notice Window
      route: notice-window
      icon: resource:icons;notice.svg
  confluence:contentBylineItem:
    - key: notice-window-byline
      resource: byline
      resolver:
        function: resolver
      render: native
      title: Notice window
      tooltip: Last day to give notice on this contract
      icon: resource:icons;notice.svg
      dynamicProperties:
        function: bylineProps
  rovo:agent:
    - key: notice-window-agent
      name: Notice Window Assistant
      description: Tells legal, finance and procurement teams which contracts in a
        Confluence space need notice soon, the last day to give it, and what
        renews automatically if nobody acts.
      prompt: resource:agent;prompt.txt
      conversationStarters:
        - Which contracts need notice in the next 30 days?
        - Fill in the contract terms from this page
        - What renews automatically next quarter, and for how much?
      actions:
        - list-notice-deadlines
        - get-contract-dates
        - get-page-text
        - set-contract-terms
  rovo:mcp:
    - key: notice-window-mcp
      name: Notice Window tools
      tools:
        - list-notice-deadlines
        - get-contract-dates
        - get-page-text
        - set-contract-terms
  action:
    - key: list-notice-deadlines
      name: List notice deadlines
      function: listNoticeDeadlines
      actionVerb: GET
      description: >
        Lists the contracts in a Confluence space whose last day to give notice
        falls within the next N days, with renewal dates, owners and annual
        values, plus contracts whose notice day has passed and pages with
        missing terms.
      inputs:
        spaceKey:
          title: Space key
          type: string
          required: true
          description: The key of the Confluence space that holds the contract pages, for
            example LEGAL.
        withinDays:
          title: Within days
          type: number
          required: false
          description: How many days ahead to look. Default 90.
    - key: get-contract-dates
      name: Get contract dates
      function: getContractDates
      actionVerb: GET
      description: >
        Returns the current term end, renewal date, last day to give notice and
        any missing terms for the contracts in a Confluence space whose title or
        counterparty matches the given text.
      inputs:
        spaceKey:
          title: Space key
          type: string
          required: true
          description: The key of the Confluence space that holds the contract pages, for
            example LEGAL.
        contract:
          title: Contract
          type: string
          required: true
          description: Part of the contract page title or the counterparty name, for
            example Orbitline.
    - key: get-page-text
      name: Get page text
      function: getPageText
      actionVerb: GET
      description: >
        Returns the plain text of a Confluence contract page (the page the user is viewing, or one given by ID or exact
        title) so the contract terms can be read from it, and says whether the page already has a terms table.
      inputs:
        page:
          title: Page
          type: string
          required: false
          description: The page ID or exact title. Leave empty for the page the user is viewing.
    - key: set-contract-terms
      name: Set contract terms
      function: setContractTerms
      actionVerb: UPDATE
      description: >
        Writes confirmed contract terms (start date, initial term, renewal, notice period, counterparty, annual value)
        into the page properties table of a Confluence contract page and returns the notice day they lead to.
      inputs:
        page:
          title: Page
          type: string
          required: false
          description: The page ID or exact title. Leave empty for the page the user is viewing.
        counterparty:
          title: Counterparty
          type: string
          required: false
          description: The other party, as named in the contract.
        startDate:
          title: Start date
          type: string
          required: true
          description: The date the contract starts, as YYYY-MM-DD.
        initialTerm:
          title: Initial term
          type: string
          required: true
          description: The length of the first term, for example 12 months.
        renewal:
          title: Renewal
          type: string
          required: true
          description: Automatic with the renewal length, for example "Automatic, 12 months", or Manual.
        noticePeriod:
          title: Notice period
          type: string
          required: true
          description: The notice needed to stop a renewal, for example 45 days.
        annualValue:
          title: Annual value
          type: string
          required: false
          description: The yearly amount with its currency, for example USD 28,800.
  function:
    - key: resolver
      handler: index.handler
    - key: bylineProps
      handler: index.bylineProperties
    - key: listNoticeDeadlines
      handler: index.listNoticeDeadlines
    - key: getContractDates
      handler: index.getContractDates
    - key: getPageText
      handler: index.getPageText
    - key: setContractTerms
      handler: index.setContractTerms
resources:
  - key: space
    path: src/frontend/space.jsx
  - key: byline
    path: src/frontend/byline.jsx
  - key: agent
    path: resources/agent
  - key: icons
    path: resources/icons
app:
  runtime:
    name: nodejs24.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/92bd8b36-c090-408b-a969-200b7b6859c4
permissions:
  scopes:
    - read:space:confluence
    - read:page:confluence
    - write:page:confluence
    - read:jira-work
    - write:jira-work
